apiVersion: v1
kind: Service
metadata:
  name: node-app-service
  namespace: production
  labels:
    app: node-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: node-app
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
